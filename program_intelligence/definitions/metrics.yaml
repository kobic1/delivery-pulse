# Metric definitions. Thresholds are configuration, never silent assumptions.
# NiCE Pod Model thresholds are still evolving: calibrate on historical data.
meta:
  owner: kobi.cohen@nice.com
  version: 0.1
  effective: 2026-10-22
  next_review: 2026-11-22

guardrails:
  min_sample_for_trend: 5          # comparable completed items
  partial_period_label: provisional
  alert_on_single_partial_week: false
  distribution: robust             # median/MAD or IQR before z-scores
  forecast: empirical_range        # no point forecasts, no Monte Carlo yet

percentiles: [50, 75, 85, 95]

metrics:
  cycle_time:
    definition: calendar time from first In Progress to Done (Ready for Dev and earlier states excluded; see workflow-status-map.yaml)
    segment_by: [issue_type]   # never mix stories, bugs, epics; no S/M/L sizing in use as of 2026-10-22
  edct:
    definition: Epic Development Cycle Time = In Progress time; Validation reported separately
  aging_wip:
    definition: current age vs historical percentile of comparable completed items
    note: risk signal, not proof of delay
  throughput:
    definition: completed items per week or Delivery Cycle, by type (no sizing in use)
    size_weighted: false
  blocked_time:
    definition: sum of explicit blocked-state intervals or flags from changelog
    caveat: missing block flags understate waiting
  scope_stability:
    definition: added/removed/reclassified after baseline
    baseline_date: delivery_cycle_start   # see delivery_cycle.calendar; commitment itself is per release
  redo_rate: {definition: TODO, owner: TODO}
  design_redo_rate: {definition: TODO, owner: TODO}

release_forecast:                # Kobi 2026-10-22, interim definition
  definition: "epics with Fix Version = release AND status != Removed AND (Commitment Type = Committed OR Commitment Type is EMPTY); Stretch excluded"
  rationale: "empty Commitment Type is presumed committed until the teams fill it in"
  pmn_27_1_value: {date: "2026-10-22", committed: 67, empty: 17, stretch: 23, forecast: 84, dashboard_showed: 85, note: "off by one: confirm snapshot timing"}
  jql: 'project = PMN AND issuetype = Epic AND fixVersion = "27.1" AND status != Removed AND (cf[10094] = Committed OR cf[10094] is EMPTY)'
  review: "revisit when Commitment Type is complete; then forecast = Committed only"

delivery_cycle:
  length_weeks: 6          # = 2 sprints of 3 weeks
  sprint_length_weeks: 3
  release_length_weeks: 12 # = 2 delivery cycles = 4 sprints; named 27.x
  epic_sizes: []           # sizing not in use
  transition: "SCRUM -> PODs in progress (2026-10); definitions below are provisional and not finalised"
  planning:
    legacy: "one full IP week between releases"
    pod_sdlc: "first 2 days of each Delivery Cycle complete the plan (Kobi 2026-10-22; not finalised)"
    plan_complete_by: "start of cycle + 2 working days"
  events: [cycle_planning_first_2_days, weekly_progress_review, cycle_end_review]
  sprint_naming: "CX.<release>.<sprint number> (<start date>), IP sprint = CX.<release>.IP"
  calendar:                # verified from Jira sprint field 2026-10-22; later dates are PROJECTED
    - {release: "26.4", sprints: [193, 194, 195, 196], ip_after: "2026-10-07 .. 2026-10-13 labelled CX.27.1.IP", verified: "194: 05Aug-25Aug, 195: 26Aug-15Sep, 196: 16Sep-06Oct"}
    - {release: "27.1", ip: "2026-10-07 .. 2026-10-13 (closed)", 
       delivery_cycle_1: {sprints: [197, 198], start: "2026-10-14", end_projected: "2026-11-24", verified: "197: 14Oct-03Nov (active)"},
       delivery_cycle_2: {sprints: [199, 200], start_projected: "2026-11-25", end_projected: "2027-01-05"}}
