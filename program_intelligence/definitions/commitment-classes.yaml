# Do not combine categories with different definitions.
meta: {owner: kobi.cohen@nice.com, version: 0.2, effective: 2026-10-22, next_review: 2026-11-22}
# Per Kobi 2026-10-22: commitment type is per RELEASE (12 weeks), not per Delivery Cycle. MVP is not in use. No S/M/L sizing at present.
level: release
classes:
  committed: {definition: "committed for the release", jira_field: "Commitment Type (customfield_10094), value Committed"}
  stretch:   {definition: "stretch for the release", jira_field: "Commitment Type (customfield_10094), value Stretch"}
hygiene:
  empty_value_is_a_gap: true   # PMN 27.1 epics on 2026-10-22, Removed excluded: 67 Committed, 23 Stretch, 17 empty (of 107)
  jql_example: 'cf[10094] = Committed'
  note: "Older notes call this 'Release Commitment' (e.g. '26.4 Committed'); the Jira field name is Commitment Type."
  mvp:       {status: not_in_use}
scope_signal:                  # confirmed by Kobi 2026-10-22
  in_scope_for_release: "Fix Version + Commitment Type. Status (incl. In Definition) does not represent scoping"
  scope_change: "change of Fix Version or Commitment Type after the baseline; never infer from status"
sizing: {status: none}   # S/M/L not tracked; do not segment by size or report size-based forecasts
